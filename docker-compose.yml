# One command to run Docket: `docker compose up --build`.
# Copy .env.example to .env first and fill in the two required secrets.
x-docket-env: &docket-env
  DATABASE_URL: postgres://docket:docket@postgres:5432/docket
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?set CREDENTIALS_ENCRYPTION_KEY in .env (openssl rand -base64 32)}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: docket
      POSTGRES_DB: docket
    volumes:
      - docket-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket -d docket"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    image: docket:local
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment: *docket-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "3000:3000"

  worker:
    image: docket:local
    restart: unless-stopped
    command: ["node", "worker.mjs"]
    env_file: .env
    environment: *docket-env
    depends_on:
      web:
        condition: service_healthy

volumes:
  docket-pgdata:
