# One command to run Docket: `docker compose up -d`. It pulls the published image
# (ghcr.io/jamiebclark/docket), so this file and a .env are all you need; no checkout or build.
# Copy .env.example to .env first and set BETTER_AUTH_SECRET and CREDENTIALS_ENCRYPTION_KEY
# (openssl rand -base64 32). For the offline walkthrough also set MOCK_PROVIDER_ENABLED=true.
# Update with `docker compose pull && docker compose up -d`.
# To build from a source checkout instead, add docker-compose.build.yml (see that file).
# Full setup, going live with real accounts, backups and hosting options: docs/deployment.md
x-docket-image: &docket-image ${DOCKET_IMAGE:-ghcr.io/jamiebclark/docket:latest}

x-docket-env: &docket-env
  # Points at the postgres service below and overrides DATABASE_URL in .env. To use Neon or another
  # external database, change it here (see docs/deployment.md, "Container host + Neon").
  DATABASE_URL: postgres://docket:docket@postgres:5432/docket
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  # The server always listens on 3000 inside the container. PORT in .env is for `pnpm dev`; set
  # DOCKET_PORT to change the host port instead.
  PORT: "3000"
  # The mock provider is off unless you turn it on. Production images default to off; set
  # MOCK_PROVIDER_ENABLED=true in .env for the local walkthrough and remove it for real use.
  # It also reaches the containers through env_file, so this line only makes the switch explicit.
  MOCK_PROVIDER_ENABLED: ${MOCK_PROVIDER_ENABLED:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?set CREDENTIALS_ENCRYPTION_KEY in .env (openssl rand -base64 32)}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: docket
      POSTGRES_DB: docket
    volumes:
      - docket-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket -d docket"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    image: *docket-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment: *docket-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    # Bound to this machine only. To reach it from your LAN, set DOCKET_BIND=0.0.0.0 in .env (and
    # BETTER_AUTH_URL to the address people use), or put a reverse proxy in front and keep the
    # loopback binding. Never publish the port directly to the internet.
    ports:
      - "${DOCKET_BIND:-127.0.0.1}:${DOCKET_PORT:-3000}:3000"

  worker:
    image: *docket-image
    restart: unless-stopped
    command: ["node", "worker.mjs"]
    env_file: .env
    environment: *docket-env
    depends_on:
      web:
        condition: service_healthy

  # A pg_dump of the database on start and then every 24 hours, into BACKUP_PATH. Dumps older than
  # BACKUP_KEEP_DAYS are deleted. Restore one as in docs/deployment.md §4. This does not back up
  # .env (CREDENTIALS_ENCRYPTION_KEY) or the media bucket; keep those safe separately.
  db-backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: docket
      PGPASSWORD: docket
      PGDATABASE: docket
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          file=/backups/docket-$$(date -u +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$file.partial"; then
            mv "$$file.partial" "$$file"
            echo "[db-backup] wrote $$file"
          else
            rm -f "$$file.partial"
            echo "[db-backup] pg_dump failed; next attempt in 24h" >&2
          fi
          find /backups -name 'docket-*.dump' -mtime +"$$KEEP_DAYS" -delete
          sleep 86400
        done

  # Offline media storage (opt-in): `docker compose --profile offline up`.
  # MinIO's upstream image is frozen; use it with the mock provider only. See docs/storage.md.
  minio:
    profiles: ["offline"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docket-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docket-dev-secret}
    volumes:
      - docket-minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  storage-init:
    profiles: ["offline"]
    image: *docket-image
    restart: "no"
    command: ["node", "scripts/storage-init.mjs"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-docket-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-docket-dev}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-docket-dev-secret}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

volumes:
  docket-pgdata:
  docket-minio:
