name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # static, test and build run in parallel; each needs only its own slice of work.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations match schema
        if: hashFiles('drizzle.config.ts') != ''
        run: pnpm db:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket
          POSTGRES_DB: docket_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://docket:docket@localhost:5432/docket_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg (the video suites skip without it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test
        run: pnpm test
        env:
          DOCKET_SKIP_PERF_TESTS: "1"
      # Timing budgets measure the query, so they run alone rather than beside thousands of parallel tests.
      - name: Performance budgets, one file at a time
        run: pnpm exec vitest run tests/integration/activity/performance.test.ts tests/integration/notifications/performance.test.ts --no-file-parallelism

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: docket:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: ffmpeg works in the image, as the runtime user
        run: |
          docker image inspect docket:ci --format 'image size: {{.Size}} bytes'
          docker run --rm --user 1001 --entrypoint ffmpeg docket:ci -version
          docker run --rm --user 1001 --entrypoint ffprobe docket:ci -version
          docker run --rm --user 1001 --entrypoint sh docket:ci -c 'ffmpeg -hide_banner -encoders | grep -q libx264'
          docker run --rm --user 1001 --entrypoint node docket:ci scripts/video-smoke.mjs
          docker run --rm --cpus=2 --user 1001 --entrypoint node docket:ci scripts/video-smoke.mjs --formatter

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, test, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.released.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # semantic-release tags HEAD when it cuts a release. A re-run on an already released commit
      # finds the tag from the earlier run, which only rebuilds the same version.
      - id: released
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # Publishes every green main commit as ghcr.io/<owner>/docket:edge (and :sha-<short>), whether
  # or not it cuts a release. `latest` stays on the last release; `edge` is for following main.
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, test, build, docker]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      edge: true

  # Publishes ghcr.io/<owner>/docket for the release cut above. A separate `release: published`
  # workflow would never run: releases created with GITHUB_TOKEN do not trigger workflows.
  image:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release.outputs.version }}
